plugins {
    id 'java'
}

group = 'me.restart'
version = '1.3'

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.223-stable'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}
